[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-leaks"
version = "0.1.0"
description = "Find and redact secrets your coding agent left in plaintext session transcripts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RBL Industries" }]
keywords = ["ai-agents", "claude-code", "secrets", "security", "redaction", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/0xelitesystem/agent-leaks"
Issues = "https://github.com/0xelitesystem/agent-leaks/issues"

[project.scripts]
leaks = "agent_leaks.cli:main"
agent-leaks = "agent_leaks.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
